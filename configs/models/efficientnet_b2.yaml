# ==============================================================================
# Model Configuration: EfficientNet-B2 Dual-Head (Experiment ID: E5)
# ==============================================================================

model:
  name: "efficientnet_b2"
  experiment_id: "E5"
  description: "ImageNet-pretrained EfficientNet-B2 with dual prediction heads"
  num_classes: 200
  num_concepts: 112
  feature_dim: 1408
  pretrained: true

training:
  batch_size: 32
  num_epochs: 40
  backbone_lr: 0.0001
  head_lr: 0.001
  weight_decay: 0.0001
  lambda_species: 1.0
  lambda_concept: 0.2
  early_stopping_patience: 10

