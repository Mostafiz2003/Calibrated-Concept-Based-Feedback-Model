# ==============================================================================
# Model Configuration: ResNet-50 + CBAM + FPN Multiscale (Experiment ID: E4)
# ==============================================================================

model:
  name: "resnet50_cbam_fpn"
  experiment_id: "E4"
  description: "Proposed multiscale architecture: ResNet-50 + CBAM + FPN + Dual Heads"
  num_classes: 200
  num_concepts: 112
  feature_dim: 2048
  fpn_channels: 256
  pretrained: true
  use_cbam: true
  use_fpn: true

training:
  batch_size: 32
  num_epochs: 40
  backbone_lr: 0.0001
  head_lr: 0.001
  weight_decay: 0.0001
  lambda_species: 1.0
  lambda_concept: 0.2
  early_stopping_patience: 10

