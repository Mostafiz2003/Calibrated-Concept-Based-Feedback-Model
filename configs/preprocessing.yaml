# ==============================================================================
# CUB-200-2011 Dataset Preprocessing & Image Verification Configuration
# Calibrated Concept-Based Feedback Model (CSE 4385)
# ==============================================================================

preprocessing:
  version: "1.0.0"
  dataset_root: "data/CUB_200_2011"
  processed_cache_dir: "data/processed/CUB_200_2011"
  output_dir: "outputs/preprocessing"

  image_specs:
    input_size: 224
    resize_size: 256
    color_channels: 3
    target_mode: "RGB"
    tensor_type: "float32"
    aspect_ratio_policy: "resize_shorter_side_then_crop"

  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

  augmentation:
    train_only: true
    random_crop: true
    horizontal_flip_prob: 0.5
    color_jitter:
      brightness: 0.1
      contrast: 0.1
      saturation: 0.0
      hue: 0.0

  evaluation:
    deterministic: true
    center_crop: true
    center_crop_size: 224

  partitions:
    train_count: 4794
    val_count: 600
    calib_count: 600
    test_count: 5794
    manifest_path: "outputs/dataset_manifest.json"
    concept_mapping_path: "data/selected_concepts_112.json"

